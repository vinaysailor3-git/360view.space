<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Virtual tour directory">
  <title>360 View | Virtual Tours</title>
  <style>
    :root { color-scheme: dark; font-family: Inter, ui-sans-serif, system-ui, sans-serif; }
    * { box-sizing: border-box; }
    body { align-items: center; background: radial-gradient(circle at top, #19365b, #07101d 62%); display: flex; margin: 0; min-height: 100vh; padding: 32px; }
    main { margin: auto; max-width: 800px; width: 100%; }
    h1 { font-size: clamp(2.2rem, 6vw, 4.5rem); letter-spacing: -.06em; margin: 0 0 12px; }
    p { color: #c3d1e2; font-size: 1.1rem; line-height: 1.6; margin: 0 0 32px; }
    .tours { display: grid; gap: 16px; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); }
    a { background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.18); border-radius: 18px; color: #fff; display: block; padding: 24px; text-decoration: none; transition: background .2s, transform .2s; }
    a:hover, a:focus-visible { background: rgba(72,157,255,.25); transform: translateY(-3px); }
    strong, span { display: block; } strong { font-size: 1.25rem; margin-bottom: 6px; } span { color: #c3d1e2; }
  </style>
</head>
<body>
  <main>
    <h1>360 View</h1>
    <p>Select a virtual tour.</p>
    <nav class="tours" aria-label="Virtual tours">
      <!-- TOUR_CARDS_START -->
      <a href="alpha/"><strong>Alpha</strong><span>Open the Alpha virtual tour</span></a>
      <a href="beta/"><strong>Beta</strong><span>Open the Beta virtual tour</span></a>
      <a href="gamma/"><strong>Gamma</strong><span>Open the Gamma virtual tour</span></a>
      <!-- TOUR_CARDS_END -->
    </nav>
  </main>
</body>
</html>
